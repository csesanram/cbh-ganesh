<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#14090a" />
  <meta name="description" content="Ganesh Utsav Selfie Booth — live camera preview with festive frame. Take a selfie and download the composite instantly. 100% client-side." />
  <title>Ganesh Utsav Selfie Booth</title>
  <style>
    :root {
      --bg: #14090a;
      --bg-soft: #1f1013;
      --card: #221114;
      --gold: #f5b942;
      --gold-deep: #d98a1f;
      --cream: #fff7e8;
      --muted: #c9aFA3;
      --danger: #ff6b6b;
      --radius: 22px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(900px 500px at 50% -10%, rgba(245, 185, 66, 0.22), transparent 60%),
        radial-gradient(700px 500px at 90% 110%, rgba(217, 48, 70, 0.18), transparent 60%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
      color: var(--cream);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 32px;
      -webkit-tap-highlight-color: transparent;
    }
    header { text-align: center; max-width: 520px; margin-bottom: 14px; }
    header h1 {
      font-size: clamp(1.4rem, 5.5vw, 2rem);
      letter-spacing: 0.3px;
      line-height: 1.2;
    }
    header h1 span { color: var(--gold); }
    header p { margin-top: 6px; font-size: 0.92rem; color: var(--muted); }

    /* Portrait stage — matches ganesh-template.png (1024 x 1536 = 2:3) */
    .stage {
      width: min(92vw, 380px);
    }
    .frame-card {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: var(--radius);
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(245, 185, 66, 0.35);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55), 0 0 0 4px rgba(245, 185, 66, 0.06);
    }
    .frame-card video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* mirror preview */
      background: #000;
    }
    #frame-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; /* fill portrait stage exactly like the template */
      pointer-events: none;
      z-index: 2;
    }
    .flash {
      position: absolute; inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 3;
    }
    .flash.go { animation: flash 0.35s ease-out; }
    @keyframes flash { 0% { opacity: 0.9; } 100% { opacity: 0; } }

    .loader {
      position: absolute; inset: 0; z-index: 1;
      display: flex; flex-direction: column; gap: 10px;
      align-items: center; justify-content: center;
      color: var(--muted); font-size: 0.9rem;
      background: #0c0607;
    }
    .loader.hidden { display: none; }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(245,185,66,0.25);
      border-top-color: var(--gold);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status {
      width: 100%;
      margin-top: 12px;
      font-size: 0.85rem;
      text-align: center;
      color: var(--muted);
      min-height: 1.4em;
    }
    .status.error {
      color: #ffd7d7;
      background: rgba(255, 107, 107, 0.12);
      border: 1px solid rgba(255, 107, 107, 0.4);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: left;
      line-height: 1.5;
    }

    .controls {
      margin-top: 12px;
      display: flex; gap: 10px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      font: inherit;
      border: 0;
      cursor: pointer;
      border-radius: 999px;
      padding: 14px 26px;
      font-weight: 700;
      font-size: 1rem;
      transition: transform 0.08s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #snap-btn {
      color: #2a1500;
      background: linear-gradient(180deg, #ffd97a, var(--gold) 55%, var(--gold-deep));
      box-shadow: 0 8px 24px rgba(245, 185, 66, 0.35);
      flex: 1 1 auto;
      max-width: 280px;
    }
    #snap-btn:not(:disabled):hover { box-shadow: 0 10px 30px rgba(245, 185, 66, 0.5); }
    #retry-btn {
      background: transparent;
      color: var(--cream);
      border: 1px solid rgba(255, 247, 232, 0.3);
      padding: 14px 18px;
    }
    /* Result (captured photo) — same portrait card so WYSIWYG */
    #result-card img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    #save-btn {
      color: #2a1500;
      background: linear-gradient(180deg, #ffd97a, var(--gold) 55%, var(--gold-deep));
      box-shadow: 0 8px 24px rgba(245, 185, 66, 0.35);
      flex: 1 1 auto;
      max-width: 280px;
    }
    #retake-btn {
      background: transparent;
      color: var(--cream);
      border: 1px solid rgba(255, 247, 232, 0.3);
      padding: 14px 18px;
    }
    .save-hint {
      margin-top: 10px;
      font-size: 0.82rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.55;
    }
    .hidden { display: none !important; }
    footer { margin-top: 18px; font-size: 0.75rem; color: rgba(201, 175, 163, 0.7); text-align: center; }
    canvas#capture-canvas { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>🙏 <span>Ganesh Utsav</span> Selfie Booth</h1>
    <p>Align your face in the frame &amp; tap “Take Selfie” — then save your photo.</p>
  </header>

  <main class="stage">
    <div class="frame-card" id="frame-card">
      <div class="loader" id="loader">
        <div class="spinner" aria-hidden="true"></div>
        <div>Starting camera…</div>
      </div>
      <video id="camera" autoplay playsinline muted></video>
      <!-- Overlay pre-populates on page load via relative path (GitHub Pages subpath-safe) -->
      <img id="frame-overlay" src="./ganesh-template.png" alt="Ganesh Utsav festive frame" fetchpriority="high" />
      <div class="flash" id="flash"></div>
    </div>

    <!-- Captured-photo result: the reliable save path on iPhone (long-press / Share sheet) -->
    <div class="frame-card hidden" id="result-card">
      <img id="result-img" alt="Your Ganesh Utsav selfie" />
    </div>

    <div class="status" id="status" role="status" aria-live="polite">Requesting camera access…</div>

    <div class="controls">
      <button id="snap-btn" type="button" disabled>📸 Take Selfie</button>
      <button id="retry-btn" type="button" hidden>↻ Retry camera</button>
      <button id="save-btn" type="button" class="hidden">💾 Save Photo</button>
      <button id="retake-btn" type="button" class="hidden">↻ Retake</button>
    </div>
    <p class="save-hint hidden" id="save-hint"></p>
  </main>

  <canvas id="capture-canvas" aria-hidden="true"></canvas>

  <footer>100% client-side · runs on GitHub Pages over HTTPS · nothing is uploaded</footer>

  <script>
    'use strict';

    const video = document.getElementById('camera');
    const overlayImg = document.getElementById('frame-overlay');
    const snapBtn = document.getElementById('snap-btn');
    const retryBtn = document.getElementById('retry-btn');
    const statusEl = document.getElementById('status');
    const loaderEl = document.getElementById('loader');
    const flashEl = document.getElementById('flash');
    const canvas = document.getElementById('capture-canvas');
    const frameCard = document.getElementById('frame-card');
    const resultCard = document.getElementById('result-card');
    const resultImg = document.getElementById('result-img');
    const saveBtn = document.getElementById('save-btn');
    const retakeBtn = document.getElementById('retake-btn');
    const saveHint = document.getElementById('save-hint');

    let stream = null;
    let frameReady = false;
    let lastBlob = null;
    let lastUrl = null;
    let lastFilename = 'Ganesh_Utsav_Selfie.png';

    // iPhone/iPad Safari ignores programmatic downloads (no `download`-attr
    // support), so on iOS we save via the Share sheet / long-press instead.
    const isIOS = () =>
      /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    const canvasToBlob = () =>
      new Promise((resolve, reject) =>
        canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('Export failed'))), 'image/png')
      );

    function canShareFile(file) {
      try {
        return !!(navigator.canShare && navigator.canShare({ files: [file] }));
      } catch (_) {
        return false;
      }
    }

    /* ---------- Overlay: pre-loaded on page load; legacy fallback ---------- */
    overlayImg.addEventListener('load', () => { frameReady = true; });
    overlayImg.addEventListener('error', () => {
      // Fallback for repos still carrying the original upload name.
      if (!overlayImg.dataset.fallback) {
        overlayImg.dataset.fallback = '1';
        overlayImg.src = './genesh-templete.jpeg';
      } else {
        setStatus('⚠️ Frame image not found. Add "ganesh-template.png" next to index.html.', true);
      }
    }, { once: false });

    function setStatus(msg, isError = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle('error', isError);
      if (isError) retryBtn.hidden = false;
    }

    function stopStream() {
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }
    }

    /* ---------- Camera ---------- */
    async function startCamera() {
      retryBtn.hidden = true;
      snapBtn.disabled = true;
      loaderEl.classList.remove('hidden');
      setStatus('Requesting camera access…');

      // 1. Secure-context guard (getUserMedia requires HTTPS; GitHub Pages provides it).
      if (!window.isSecureContext && !['localhost', '127.0.0.1'].includes(location.hostname)) {
        loaderEl.classList.add('hidden');
        setStatus(
          '⚠️ Camera needs a secure (HTTPS) page. This app must be opened via https:// (GitHub Pages serves HTTPS by default). ' +
          'If you opened it as a plain file or over http://, please use the https:// Pages URL and allow camera access.',
          true
        );
        return;
      }

      // 2. API-support guard.
      if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
        loaderEl.classList.add('hidden');
        setStatus(
          '⚠️ Camera API not supported in this browser. Please use the latest Chrome, Edge, Firefox, or Safari over HTTPS.',
          true
        );
        return;
      }

      stopStream();

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1080 }, height: { ideal: 1920 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play().catch(() => { /* autoplay policies: muted+playsinline already set */ });
        loaderEl.classList.add('hidden');
        snapBtn.disabled = false;
        setStatus('✅ Live preview ready — pose & tap “Take Selfie”.');
      } catch (err) {
        loaderEl.classList.add('hidden');
        const name = err && err.name ? err.name : '';
        let msg;
        if (name === 'NotAllowedError' || name === 'SecurityError') {
          msg = '🚫 Camera access was blocked. Tap the camera icon in the address bar → Allow, then press “Retry camera”. (HTTPS + permission required.)';
        } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
          msg = '📷 No front camera found on this device. Try a phone/laptop with a camera.';
        } else if (name === 'NotReadableError') {
          msg = '📷 Camera is busy (another app/tab is using it). Close other apps and retry.';
        } else {
          msg = '⚠️ Could not start the camera (' + (err.message || name || 'unknown error') + '). Check HTTPS + permissions, then retry.';
        }
        setStatus(msg, true);
      }
    }

    /* Draw video into canvas with "object-fit: cover" + horizontal mirror. */
    function drawVideoCoverMirrored(ctx, w, h) {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) throw new Error('Video not ready yet — wait a moment and try again.');
      const scale = Math.max(w / vw, h / vh);
      const dw = vw * scale;
      const dh = vh * scale;
      const dx = (w - dw) / 2;
      const dy = (h - dh) / 2;
      ctx.save();
      ctx.translate(w, 0);
      ctx.scale(-1, 1); // match the mirrored preview
      ctx.drawImage(video, dx, dy, dw, dh);
      ctx.restore();
    }

    /* ---------- Capture ---------- */
    async function takeSelfie() {
      if (!stream) {
        setStatus('Camera is not running. Press “Retry camera” first.', true);
        return;
      }
      snapBtn.disabled = true;
      try {
        // Output size: full frame-artwork resolution when available, else hi-res video.
        let outW = 1080, outH = 1620; // 2:3 fallback (matches 1024x1536 template ratio)
        if (frameReady && overlayImg.naturalWidth > 0) {
          outW = overlayImg.naturalWidth;
          outH = overlayImg.naturalHeight;
        }
        canvas.width = outW;
        canvas.height = outH;
        const ctx = canvas.getContext('2d');

        // a+b. Video snapshot, horizontally flipped to match mirrored preview.
        drawVideoCoverMirrored(ctx, outW, outH);

        // c. Frame artwork on top, full-bleed.
        if (frameReady && overlayImg.naturalWidth > 0) {
          ctx.drawImage(overlayImg, 0, 0, outW, outH);
        } else {
          // Ensure the file is decodable before drawing (e.g. slow network).
          await new Promise((resolve, reject) => {
            const im = new Image();
            im.onload = () => { overlayImg.src = './ganesh-template.png'; resolve(); };
            im.onerror = reject;
            im.src = './ganesh-template.png';
          }).catch(() => {});
          if (frameReady) ctx.drawImage(overlayImg, 0, 0, outW, outH);
        }

        flashEl.classList.remove('go');
        void flashEl.offsetWidth; // restart animation
        flashEl.classList.add('go');

        // d. Export once; reuse the blob for preview + every save path.
        const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        lastFilename = 'Ganesh_Utsav_Selfie_' + stamp + '.png';
        lastBlob = await canvasToBlob();
        if (lastUrl) URL.revokeObjectURL(lastUrl);
        lastUrl = URL.createObjectURL(lastBlob);
        resultImg.src = lastUrl;

        showResult();

        // e. Desktop/Android: keep the instant auto-download.
        // iOS: skip it (Mobile Safari silently drops programmatic downloads —
        // the Save button + visible photo below are the working path there).
        if (!isIOS()) {
          triggerAnchorDownload();
          setStatus('🎉 Saved ' + lastFilename + ' — check your downloads. You can also re-save below.');
        } else {
          setStatus('🎉 Photo ready! Tap “Save Photo”, then choose “Save Image”.');
        }
      } catch (err) {
        setStatus('⚠️ Capture failed: ' + (err.message || err), true);
      } finally {
        snapBtn.disabled = false;
      }
    }

    function triggerAnchorDownload() {
      const a = document.createElement('a');
      a.href = lastUrl;
      a.download = lastFilename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function showResult() {
      frameCard.classList.add('hidden');
      resultCard.classList.remove('hidden');
      snapBtn.classList.add('hidden');
      retryBtn.hidden = true;
      saveBtn.classList.remove('hidden');
      retakeBtn.classList.remove('hidden');
      saveHint.classList.add('hidden');
      saveHint.textContent = '';
    }

    function retake() {
      if (lastUrl) { URL.revokeObjectURL(lastUrl); lastUrl = null; }
      lastBlob = null;
      resultImg.removeAttribute('src');
      resultCard.classList.add('hidden');
      frameCard.classList.remove('hidden');
      saveBtn.classList.add('hidden');
      retakeBtn.classList.add('hidden');
      saveHint.classList.add('hidden');
      snapBtn.classList.remove('hidden');
      if (stream) setStatus('✅ Live preview ready — pose & tap “Take Selfie”.');
      else startCamera();
    }

    /* ---------- Save (iPhone-safe) ---------- */
    async function savePhoto() {
      if (!lastBlob) {
        setStatus('Nothing to save yet — take a selfie first.', true);
        return;
      }
      const file = new File([lastBlob], lastFilename, { type: 'image/png' });

      // 1. Share sheet (iPhone/iPad/Android) → "Save Image" lands in Photos.
      if (canShareFile(file)) {
        try {
          await navigator.share({ files: [file], title: 'Ganesh Utsav Selfie' });
          setStatus('🎉 Shared — choose “Save Image” to keep it in Photos.');
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return; // user dismissed sheet
          // fall through to next method
        }
      }

      // 2. Classic download (desktop + Android Chrome).
      if (!isIOS()) {
        triggerAnchorDownload();
        setStatus('🎉 Saved ' + lastFilename + ' — check your downloads.');
        return;
      }

      // 3. iPhone without Share API: long-press the visible photo.
      saveHint.textContent =
        '👆 Touch and hold the photo above, then tap “Save to Photos” (or “Add to Photos”).';
      saveHint.classList.remove('hidden');
      setStatus('Use touch-and-hold on the photo to save it.');
    }

    snapBtn.addEventListener('click', takeSelfie);
    saveBtn.addEventListener('click', savePhoto);
    retakeBtn.addEventListener('click', retake);
    retryBtn.addEventListener('click', startCamera);

    // Auto-request front camera on page load.
    window.addEventListener('DOMContentLoaded', startCamera);
    // Release camera when tab hidden/closed.
    document.addEventListener('visibilitychange', () => { if (document.hidden) stopStream(); });
    window.addEventListener('pagehide', stopStream);
  </script>
</body>
</html>
